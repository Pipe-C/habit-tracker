<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Habit Tracker - Java</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo-dot"></div>
    <h1>Habit Tracker</h1>
    <span>Desarrollado con Spring Boot</span>
</header>

<div class="container">

    <div class="form-card">
        <h2>Nuevo hábito</h2>

        <div class="field">
            <label>Nombre</label>
            <input type="text" id="name" placeholder="Ej: Leer 30 minutos" />
        </div>

        <div class="field">
            <label>Descripción</label>
            <input type="text" id="description" placeholder="Opcional" />
        </div>

        <div class="field">
            <label>Categoría</label>
            <select id="category">
                <option value="HEALTH">Salud</option>
                <option value="STUDY">Estudio</option>
                <option value="FINANCE">Finanzas</option>
                <option value="MINDFULNESS">Bienestar mental</option>
                <option value="OTHER">Otro</option>
            </select>
        </div>

        <div class="field">
            <label>Frecuencia</label>
            <select id="type">
                <option value="daily">Diario</option>
                <option value="weekly">Semanal</option>
            </select>
        </div>

        <div class="field" id="timesPerWeekContainer">
            <label>Veces por semana</label>
            <input type="number" id="timesPerWeek" placeholder="1 - 7" min="1" max="7" />
        </div>

        <button class="btn-primary" onclick="createHabit()">Crear hábito</button>
    </div>

    <div class="habits-section">
        <h2>Mis hábitos</h2>
        <div class="habit-list" id="habitList"></div>
    </div>

</div>

<script src="app.js"></script>

</body>
</html>
